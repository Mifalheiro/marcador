<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Marcador do direto. Ocupa a largura toda da página: no PRISM ajusta o tamanho do widget. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* sem aumento automático de letra nos telemóveis */
  body { font-family: 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
  .fundo-teste { background: #3a7d3a; }

  #bug {
    /* altura de cada linha: o marcador cabe na largura da página mesmo com 5 sets
       (com 1 set ocupa ~80% e as colunas dos sets anteriores crescem para a direita) */
    --h: calc(100vw / 5);
    width: max-content;
    display: grid;
    /* emblema | jogos | clube | seta | atletas | sets | pontos | time out */
    /* o nome do clube e os atletas repartem o espaço do meio (os atletas ficam com um pouco mais) */
    grid-template-columns: var(--h) var(--h) calc(var(--h) * 4.2) calc(var(--h) * 1.05) calc(var(--h) * 5) var(--h) calc(var(--h) * 1.15) calc(var(--h) * .95);
    grid-template-rows: var(--h) var(--h);
    background: linear-gradient(180deg, #0f2366 0%, #0a1748 50%, #0c1c58 100%);
    transition: opacity .4s, transform .4s;
  }
  #bug.escondido { opacity: 0; transform: translateY(20%); }

  .logo { display: flex; align-items: center; justify-content: center; background: #fff; border-bottom: 1px solid #0a1748; }
  .logo img { max-width: 88%; max-height: 88%; }
  .logo.vazio { background: transparent; }

  .num { display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: calc(var(--h) * .78); line-height: 1; font-variant-numeric: tabular-nums; }
  .jogos, .sets { background: linear-gradient(180deg, #ffd84a 0%, #f2b705 100%); color: #0a1748; border-bottom: 1px solid #0a1748; }
  .pontos { color: #fff; background: rgba(0,0,0,.25); }
  /* pontos dos sets anteriores, à esquerda dos pontos do set em curso */
  /* em cada set acabado, o número de quem ganhou fica em negrito e o outro mais fino */
  .num.ganhou { font-weight: 900; }
  .num.perdeu { font-weight: 400; opacity: .7; }
  .parc { color: #fff; background: rgba(255,255,255,.06); border-left: 1px solid rgba(255,255,255,.12); }

  .nome { display: flex; align-items: center; min-width: 0; padding: 0 calc(var(--h) * .2);
    color: #fff; font-size: calc(var(--h) * .58); white-space: nowrap; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .chev { grid-row: 1 / span 2; grid-column: 4; }
  .chev svg { width: 100%; height: 100%; display: block; }

  /* nomes dos atletas, entre a seta e os sets */
  .atleta { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 0 calc(var(--h) * .15) 0 calc(var(--h) * .1);
    color: #ffe9a8; font-weight: 700; white-space: nowrap; overflow: hidden; line-height: 1.05;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .atleta span { display: block; overflow: hidden; }

  /* time out: T branco; nos primeiros 60 s aparece o tempo por cima */
  .to { display: flex; align-items: center; justify-content: center; }
  .to .t { display: none; position: relative; width: 78%; height: 78%; background: #f4f4f4; border-radius: 3px;
    align-items: center; justify-content: center; color: #111; font-weight: 900;
    font-family: 'Arial Black', Arial, sans-serif; font-size: calc(var(--h) * .62); line-height: 1; }
  .to.usado .t { display: flex; }
  .to .seg { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
    background: #f2b705; color: #0a1748; border-radius: 3px; font-size: calc(var(--h) * .5); font-family: Arial, sans-serif; font-weight: 800; }
  .to.contar .seg { display: flex; }

  /* Fim do encontro (uma equipa chegou aos 4 jogos): 30 s com o resultado do último jogo, depois esta faixa durante 5 min; depois esconde tudo */
  #final { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: linear-gradient(180deg, #0f2366, #0a1748); color: #fff; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #final.ver { opacity: 1; }
  /* ?baixo = marcador encostado ao fundo do ecrã (usado dentro do widget do duelo) */
  html.baixo #bug { position: fixed; left: 0; bottom: 0; --h: calc(100vw / 34); }   /* ~45% da largura do vídeo */
  html.baixo #final { top: auto; bottom: 0; }
  #final .t1 { color: #f2b705; font-weight: 800; letter-spacing: .12em; }
  #final .t2 { font-weight: 700; white-space: nowrap; }
  #final .t2 b { color: #ffd84a; margin: 0 .4em; }
  .flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { filter: brightness(1.8); transform: scale(1.18); } 100% { filter: none; transform: none; } }
</style>
</head>
<body>
  <div id="bug" class="escondido">
    <div class="logo" id="la" style="grid-column:1;grid-row:1"></div>
    <div class="num jogos" id="ja" style="grid-column:2;grid-row:1">0</div>
    <div class="nome" id="na" style="grid-column:3;grid-row:1"></div>
    <div class="chev">
      <svg viewBox="0 0 40 100" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d99a00"/></linearGradient></defs>
        <polygon points="0,0 14,0 40,50 14,100 0,100 26,50" fill="url(#g)"/>
      </svg>
    </div>
    <div class="atleta" id="aa" style="grid-column:5;grid-row:1"></div>
    <div class="num sets" id="sa" style="grid-column:6;grid-row:1">0</div>
    <div class="num pontos" id="pa" style="grid-row:1">0</div>
    <div class="to" id="ta" style="grid-row:1"><div class="t">T<div class="seg"></div></div></div>

    <div class="logo" id="lb" style="grid-column:1;grid-row:2"></div>
    <div class="num jogos" id="jb" style="grid-column:2;grid-row:2">0</div>
    <div class="nome" id="nb" style="grid-column:3;grid-row:2"></div>
    <div class="atleta" id="ab" style="grid-column:5;grid-row:2"></div>
    <div class="num sets" id="sb" style="grid-column:6;grid-row:2">0</div>
    <div class="num pontos" id="pb" style="grid-row:2">0</div>
    <div class="to" id="tb" style="grid-row:2"><div class="t">T<div class="seg"></div></div></div>
  </div>

  <div id="final"><div class="t1">RESULTADO FINAL</div><div class="t2" id="finalTxt"></div></div>

<script type="module">
  // Marcador ligado à Firebase (Realtime Database): recebe cada alteração no momento.
  // Fica sempre na mesma ordem (o "Trocar lados" do controlo não mexe aqui).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { firebaseConfig } from "./firebase-config.js";

  const DURACAO_TO = 60;
  if (location.search.indexOf("teste") >= 0) document.body.className = "fundo-teste";
  if (/[?&]baixo/.test(location.search)) document.documentElement.classList.add("baixo");

  const db = getDatabase(initializeApp(firebaseConfig));
  let logos = {}, ultimo = null, desvio = 0;   // desvio = diferença entre o relógio deste aparelho e o da Firebase

  function porNumero(id, valor) {
    const el = document.getElementById(id);
    if (el.textContent !== String(valor)) {
      el.textContent = valor;
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  }
  function porLogo(id, eq) {
    const el = document.getElementById(id);
    const src = eq.logo === "slot" ? logos[eq.slot] : "";
    if (src) { el.className = "logo"; el.innerHTML = '<img src="' + src + '">'; }
    else { el.className = "logo vazio"; el.innerHTML = ""; }
  }
  function porTimeOut(id, eq) {
    const el = document.getElementById(id);
    const usado = (eq.timeout || 0) > 0;
    const falta = usado && eq.toInicio ? Math.ceil(DURACAO_TO - (Date.now() + desvio - eq.toInicio) / 1000) : 0;
    el.className = "to" + (usado ? " usado" : "") + (falta > 0 ? " contar" : "");
    el.querySelector(".seg").textContent = falta > 0 ? falta : "";
  }
  // encolhe a letra de um elemento até o texto caber na largura (tam e min em fração da altura da linha)
  function caber(el, tam, min) {
    let f = tam; el.style.fontSize = "calc(var(--h) * " + f + ")";
    while (el.scrollWidth > el.clientWidth + 1 && f > min) { f -= 0.02; el.style.fontSize = "calc(var(--h) * " + f.toFixed(2) + ")"; }
  }
  // nome do clube
  function porNome(id, txt) {
    const el = document.getElementById(id);
    if (el.textContent !== (txt || "")) el.textContent = txt || "";
    caber(el, 0.58, 0.18);
  }
  // No direto mostra só o primeiro e o último nome ("ANDRE DIOGO SOUSA CAMARINHA" → "ANDRE CAMARINHA").
  // Apelidos compostos ficam juntos ("LUÍS FILIPE SA VILAS BOAS" → "LUÍS VILAS BOAS").
  const COMPOSTOS = ["VILAS BOAS", "VILLAS BOAS", "CASTELO BRANCO", "VILA NOVA", "VILA REAL", "VILA VERDE", "MONTE NEGRO",
    "SANTA RITA", "SÃO JOSÉ", "SAO JOSE", "SÃO PEDRO", "SAO PEDRO", "SÃO JOÃO", "SAO JOAO", "BOA VENTURA", "PAIS DE SOUSA"];
  function curto(nome) {
    const p = nome.split(/\s+/).filter(Boolean);
    if (p.length <= 2) return p.join(" ");
    const up = p.map(x => x.toUpperCase());
    let i = p.length - 1;   // início do apelido final
    for (const c of COMPOSTOS) {
      const n = c.split(" ").length;
      if (p.length - n >= 1 && up.slice(-n).join(" ") === c) { i = p.length - n; break; }
    }
    return [p[0]].concat(p.slice(i)).join(" ");
  }
  // atletas: um nome numa linha; num par ("A / B") cada nome na sua linha
  function porAtleta(id, txt) {
    const el = document.getElementById(id);
    const nomes = String(txt || "").split("/").map(x => curto(x.trim())).filter(Boolean);
    el.innerHTML = nomes.map(n => "<span></span>").join("");
    el.querySelectorAll("span").forEach((sp, i) => { sp.textContent = nomes[i]; });
    const tam = nomes.length > 1 ? 0.36 : 0.52, min = nomes.length > 1 ? 0.22 : 0.28;
    el.style.fontSize = "";
    el.querySelectorAll("span").forEach(sp => caber(sp, tam, min));
  }
  // Sets anteriores do jogo: uma coluna por set, entre os sets (amarelo) e os pontos do set em curso.
  // Enquanto o set acabado de fechar ainda está nos pontos, não se repete.
  function porParciais(s) {
    let lista = Array.isArray(s.parciais) ? s.parciais : Object.values(s.parciais || {});
    if (s.setFechado && lista.length) lista = lista.slice(0, -1);
    const bug = document.getElementById("bug");
    bug.querySelectorAll(".parc").forEach(el => el.remove());
    lista.forEach((p, i) => {
      ["a", "b"].forEach((L, r) => {
        const d = document.createElement("div");
        const meu = Number(p[r]), outro = Number(p[1 - r]);
        d.className = "num parc " + (meu > outro ? "ganhou" : meu < outro ? "perdeu" : ""); d.textContent = p[r];
        d.style.gridColumn = 7 + i; d.style.gridRow = r + 1;
        bug.appendChild(d);
      });
    });
    // set acabado de fechar (ainda na coluna dos pontos): também mostra quem ganhou
    const pa = document.getElementById("pa"), pb = document.getElementById("pb");
    [pa, pb].forEach(el => el.classList.remove("ganhou", "perdeu"));
    if (s.setFechado) {
      const x = s.a.pontos || 0, y = s.b.pontos || 0;
      if (x !== y) { (x > y ? pa : pb).classList.add("ganhou"); (x > y ? pb : pa).classList.add("perdeu"); }
    }
    const n = lista.length;
    ["pa", "pb"].forEach(id => document.getElementById(id).style.gridColumn = 7 + n);
    ["ta", "tb"].forEach(id => document.getElementById(id).style.gridColumn = 8 + n);
    // as colunas da esquerda têm largura fixa: só se acrescentam colunas à direita
    bug.style.gridTemplateColumns = "var(--h) var(--h) calc(var(--h) * 4.2) calc(var(--h) * 1.05) calc(var(--h) * 5) var(--h) " +
      "var(--h) ".repeat(n) + "calc(var(--h) * 1.15) calc(var(--h) * .95)";
  }
  // Fim do encontro (uma equipa chegou aos 4 jogos), mesmo que se carregue em Esconder:
  //   1) 30 s com o marcador e o resultado do último jogo;  2) 5 min com a faixa RESULTADO FINAL;  3) esconde tudo
  const ULTIMO_JOGO = 30 * 1000, DURACAO_FINAL = 5 * 60 * 1000;
  let chaveFinal = "", inicioFinal = 0;
  function porFinal(s) {
    const el = document.getElementById("final"), bug = document.getElementById("bug");
    const ja = s.a.jogos || 0, jb = s.b.jogos || 0;
    const acabou = !!(s.fimJogo && (ja >= 4 || jb >= 4));   // sempre true/false (o toggle com undefined alternava a faixa)
    if (acabou) {
      const chave = ja + "-" + jb + "|" + s.a.nome + "|" + s.b.nome;
      if (chave !== chaveFinal) { chaveFinal = chave; inicioFinal = Date.now(); }
      document.getElementById("finalTxt").innerHTML = "";
      const t = document.getElementById("finalTxt");
      t.append(s.a.nome || ""); const bb = document.createElement("b"); bb.textContent = ja + " - " + jb; t.append(bb); t.append(s.b.nome || "");
    } else chaveFinal = "";
    const r = bug.getBoundingClientRect();
    el.style.width = r.width + "px"; el.style.height = r.height + "px";
    const h = r.height / 2;
    el.querySelector(".t1").style.fontSize = (h * .42) + "px";
    const t2 = el.querySelector(".t2"); let f = h * .62; t2.style.fontSize = f + "px";
    while (t2.scrollWidth > r.width * .96 && f > 8) { f -= 1; t2.style.fontSize = f + "px"; }   // nomes compridos encolhem
    const t = Date.now() - inicioFinal;
    el.classList.toggle("ver", acabou && t >= ULTIMO_JOGO && t < ULTIMO_JOGO + DURACAO_FINAL);
    if (acabou) bug.className = t < ULTIMO_JOGO ? "" : "escondido";   // marcador só nos primeiros 30 s
  }
  function desenhar(s) {
    if (!s || !s.a || !s.b) return;
    ultimo = s;
    document.getElementById("bug").className = s.visivel === false ? "escondido" : "";
    porParciais(s);   // primeiro as colunas, para os nomes encolherem ao espaço certo
    porNome("na", s.a.nome); porNome("nb", s.b.nome);
    porAtleta("aa", s.a.atleta); porAtleta("ab", s.b.atleta);
    porNumero("ja", s.a.jogos || 0); porNumero("jb", s.b.jogos || 0);
    porNumero("sa", s.a.sets || 0);  porNumero("sb", s.b.sets || 0);
    porNumero("pa", s.a.pontos || 0); porNumero("pb", s.b.pontos || 0);
    porLogo("la", s.a); porLogo("lb", s.b);
    porTimeOut("ta", s.a); porTimeOut("tb", s.b);
    porFinal(s);
  }

  onValue(ref(db, ".info/serverTimeOffset"), snap => { desvio = snap.val() || 0; });
  onValue(ref(db, "marcador/estado"), snap => desenhar(snap.val()), erro);
  onValue(ref(db, "marcador/logos"), snap => { logos = snap.val() || {}; if (ultimo) desenhar(ultimo); }, erro);
  setInterval(() => { if (ultimo) { porTimeOut("ta", ultimo.a); porTimeOut("tb", ultimo.b); porFinal(ultimo); } }, 250);

  function erro(e) {
    if (location.search.indexOf("teste") < 0) return;
    const d = document.createElement("div");
    d.style.cssText = "background:#fff;color:#a00;font:18px Arial;padding:8px";
    d.textContent = "Erro Firebase: " + (e && e.message ? e.message : e);
    document.body.appendChild(d);
  }
</script>
</body>
</html>
