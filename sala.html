<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marcador – Sala</title>
<style>
  /* Ecrã para a sala de jogo (tablet / TV). Toca no ecrã para ficar em ecrã inteiro. */
  html, body { margin: 0; height: 100%; background: #071034; color: #fff; overflow: hidden;
    font-family: 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; user-select: none; }
  #ecra { display: flex; height: 100%; }
  .lado { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 3vh 2vw; background: linear-gradient(180deg, #13225e, #0a1748); }
  .divisao { width: 0.6vw; background: #f2b705; order: 2; }
  #lado_a { order: 1; } #lado_b { order: 3; }
  .topo { display: flex; align-items: center; gap: 2vw; max-width: 100%; min-height: 12vh; }
  .topo img { height: 12vh; width: 12vh; object-fit: contain; background: #fff; border-radius: 1vh; }
  .topo .nome { font-size: 6vh; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pontos { font-size: 52vh; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .baixo { display: flex; gap: 3vw; align-items: center; }
  .caixa { text-align: center; }
  .caixa .rot { font-size: 3.2vh; opacity: .8; letter-spacing: .1em; }
  .caixa .val { font-size: 11vh; font-weight: 800; line-height: 1.05; min-width: 14vh; padding: 0 2vh; border-radius: 1.2vh;
    background: linear-gradient(180deg, #ffd84a, #f2b705); color: #0a1748; }
  .caixa.jogos .val { background: rgba(255,255,255,.12); color: #fff; font-size: 8vh; }
  .flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { color: #ffd84a; transform: scale(1.06); } 100% { transform: none; } }
  #aviso { position: fixed; bottom: 1vh; left: 0; right: 0; text-align: center; font-size: 2.2vh; opacity: .5; }
</style>
</head>
<body>
  <div id="ecra">
    <div class="lado" id="lado_a">
      <div class="topo"><span id="logo_a"></span><div class="nome" id="nome_a"></div></div>
      <div class="pontos" id="pts_a">0</div>
      <div class="baixo">
        <div class="caixa"><div class="rot">SETS</div><div class="val" id="sets_a">0</div></div>
        <div class="caixa jogos"><div class="rot">JOGOS</div><div class="val" id="jogos_a">0</div></div>
      </div>
    </div>
    <div class="divisao"></div>
    <div class="lado" id="lado_b">
      <div class="topo"><span id="logo_b"></span><div class="nome" id="nome_b"></div></div>
      <div class="pontos" id="pts_b">0</div>
      <div class="baixo">
        <div class="caixa"><div class="rot">SETS</div><div class="val" id="sets_b">0</div></div>
        <div class="caixa jogos"><div class="rot">JOGOS</div><div class="val" id="jogos_b">0</div></div>
      </div>
    </div>
  </div>
  <div id="aviso">Toca no ecrã para ecrã inteiro</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { firebaseConfig } from "./firebase-config.js";

  const db = getDatabase(initializeApp(firebaseConfig));
  let logos = {}, ultimo = null;

  function num(id, v) {
    const el = document.getElementById(id);
    if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
  function desenhar(s) {
    if (!s || !s.a || !s.b) return;
    ultimo = s;
    // os lados trocam quando o controlo carrega em "Trocar lados"
    document.getElementById("lado_a").style.order = s.ladosTrocados ? 3 : 1;
    document.getElementById("lado_b").style.order = s.ladosTrocados ? 1 : 3;
    ["a", "b"].forEach(L => {
      const eq = s[L];
      document.getElementById("nome_" + L).textContent = eq.nome || "";
      num("pts_" + L, eq.pontos || 0); num("sets_" + L, eq.sets || 0); num("jogos_" + L, eq.jogos || 0);
      const src = eq.logo === "navais" ? "navais.png" : (eq.logo === "slot" ? logos[eq.slot] : "");
      document.getElementById("logo_" + L).innerHTML = src ? '<img src="' + src + '">' : "";
    });
  }
  onValue(ref(db, "marcador/estado"), snap => desenhar(snap.val()));
  onValue(ref(db, "marcador/logos"), snap => { logos = snap.val() || {}; if (ultimo) desenhar(ultimo); });

  // Toque: ecrã inteiro + não deixar o ecrã apagar
  document.body.addEventListener("click", async () => {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
    document.getElementById("aviso").style.display = "none";
  });
</script>
</body>
</html>
