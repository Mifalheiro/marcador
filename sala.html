<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marcador – Sala</title>
<style>
  /* Ecrã para a sala de jogo (tablet / TV). Toca no ecrã para ficar em ecrã inteiro.
     O lado esquerdo e o direito são posições na mesa: quando o controlo carrega em "Trocar lados", as equipas trocam de posição. */
  html, body { margin: 0; height: 100%; color: #fff; overflow: hidden; user-select: none;
    background: linear-gradient(180deg, #13225e, #0a1748);
    font-family: 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif; }
  #ecra { display: flex; height: 100%; }
  .pos { flex: 1; display: grid; grid-template-rows: auto 1fr auto; padding: 2.5vh 2vw; min-width: 0; }

  /* topo: emblema · nome · jogos  (espelhado à direita) */
  .topo { display: flex; align-items: center; gap: 2vw; min-width: 0; }
  .dir .topo { flex-direction: row-reverse; }
  .emblema { flex: none; width: 13vh; height: 13vh; position: relative; }
  .saque { display: none; position: absolute; left: 50%; top: calc(100% + 1.6vh); width: 4vh; height: 4vh; margin-left: -2vh;
    border-radius: 50%; background: #22c55e; box-shadow: 0 0 1.5vh rgba(34,197,94,.8); }
  .saque.sim { display: block; }
  .emblema img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 1vh; }
  .nome { flex: 1; font-size: 7vh; font-weight: 700; white-space: nowrap; overflow: hidden; min-width: 0; }
  .dir .nome { text-align: right; }
  .jogos { flex: none; text-align: center; }
  .jogos .rot { font-size: 3.4vh; letter-spacing: .1em; opacity: .85; }
  .jogos .val { width: 14vh; height: 11vh; line-height: 11vh; font-size: 9vh; font-weight: 800;
    background: #fff; color: #0a1748; border-radius: .6vh; font-variant-numeric: tabular-nums; }

  /* pontos */
  .pontos { display: flex; align-items: center; justify-content: center; font-size: 50vh; font-weight: 800;
    line-height: 1; font-variant-numeric: tabular-nums; }

  /* fundo: time out · sets  (espelhado à direita) */
  .fundo { display: flex; align-items: flex-end; justify-content: space-between; }
  .dir .fundo { flex-direction: row-reverse; }
  .sets { text-align: center; margin: 0 auto; }
  .sets .rot { font-size: 4.4vh; letter-spacing: .1em; opacity: .85; }
  .sets .val { width: 18vh; height: 12vh; line-height: 12vh; font-size: 11vh; font-weight: 800; border-radius: 1.2vh;
    background: linear-gradient(180deg, #ffd84a, #f2b705); color: #0a1748; font-variant-numeric: tabular-nums; }

  /* T de time out: aparece quando a equipa pede time out e fica até ao jogo seguinte;
     nos primeiros 60 s tem a contagem por cima */
  .to { flex: none; width: 17vh; height: 15vh; visibility: hidden; }
  .to.usado { visibility: visible; }
  .to .seg { display: none; position: absolute; inset: 0; border-radius: .6vh; align-items: center; justify-content: center;
    background: #f2b705; color: #0a1748; font-size: 9vh; font-weight: 900; font-family: Arial, sans-serif; }
  .to.contar .seg { display: flex; }
  .to .caixa { position: relative; width: 100%; height: 100%; background: #000; border-radius: .6vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .to .t { font-size: 11vh; font-weight: 900; line-height: .9; font-family: Arial Black, Arial, sans-serif; }
  .to .txt { font-size: 2.6vh; font-weight: 900; letter-spacing: .02em; font-family: Arial Black, Arial, sans-serif; }

  .flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { color: #ffd84a; transform: scale(1.06); } 100% { transform: none; } }
  #tituloJogos { position: fixed; top: 2.5vh; left: 0; right: 0; text-align: center;
    font-size: 3.4vh; letter-spacing: .1em; opacity: .85; pointer-events: none; }
  #aviso { position: fixed; bottom: 1vh; left: 0; right: 0; text-align: center; font-size: 2.2vh; opacity: .5; }
</style>
</head>
<body>
  <div id="ecra"></div>
  <div id="tituloJogos">RESULTADO FINAL</div>
  <div id="aviso">Toca no ecrã para ecrã inteiro</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { firebaseConfig } from "./firebase-config.js";

  // Duas posições fixas no ecrã: E (esquerda) e D (direita)
  const posicao = P => `
    <div class="pos ${P === "D" ? "dir" : ""}">
      <div class="topo">
        <div class="emblema"><div id="emb${P}" style="width:100%;height:100%"></div><div class="saque" id="sq${P}"></div></div>
        <div class="nome" id="nome${P}"></div>
        <div class="jogos"><div class="rot">&nbsp;</div><div class="val" id="jogos${P}">0</div></div>
      </div>
      <div class="pontos" id="pts${P}">0</div>
      <div class="fundo">
        <div class="to" id="to${P}"><div class="caixa"><div class="t">T</div><div class="txt">TIME OUT</div><div class="seg"></div></div></div>
        <div class="sets"><div class="rot">SETS</div><div class="val" id="sets${P}">0</div></div>
        <div class="to" style="visibility:hidden"></div>
      </div>
    </div>`;
  document.getElementById("ecra").innerHTML = posicao("E") + posicao("D");

  const db = getDatabase(initializeApp(firebaseConfig));
  let logos = {}, ultimo = null;

  function num(id, v) {
    const el = document.getElementById(id);
    if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
  // nome encolhe a letra até caber
  function ajustarNome(el) {
    let t = 7; el.style.fontSize = t + "vh";
    while (el.scrollWidth > el.clientWidth && t > 3) { t -= 0.25; el.style.fontSize = t + "vh"; }
  }
  window.addEventListener("resize", () => { ajustarNome(document.getElementById("nomeE")); ajustarNome(document.getElementById("nomeD")); });
  function pintar(P, eq) {
    const n = document.getElementById("nome" + P);
    if (n.textContent !== (eq.nome || "")) { n.textContent = eq.nome || ""; }
    ajustarNome(n);
    num("pts" + P, eq.pontos || 0); num("sets" + P, eq.sets || 0); num("jogos" + P, eq.jogos || 0);
    const src = eq.logo === "navais" ? "navais.png" : (eq.logo === "slot" ? logos[eq.slot] : "");
    document.getElementById("emb" + P).innerHTML = src ? '<img src="' + src + '">' : "";
    porTimeOut(P, eq);
  }
  const DURACAO_TO = 60; let desvio = 0;
  function porTimeOut(P, eq) {
    const el = document.getElementById("to" + P), usado = (eq.timeout || 0) > 0;
    const falta = usado && eq.toInicio ? Math.ceil(DURACAO_TO - (Date.now() + desvio - eq.toInicio) / 1000) : 0;
    el.className = "to" + (usado ? " usado" : "") + (falta > 0 ? " contar" : "");
    el.querySelector(".seg").textContent = falta > 0 ? falta : "";
  }
  // Quem serve: troca a cada 2 pontos; a partir de 10-10 troca a cada ponto;
  // em cada set novo começa quem recebeu primeiro no set anterior.
  function servidor(s) {
    if (!s || !s.saqueInicial || s.fimJogo) return null;
    const P = s.pontosSet || 11, outro = x => (x === "a" ? "b" : "a");
    const k = (s.a.sets || 0) + (s.b.sets || 0);
    const primeiro = k % 2 === 0 ? s.saqueInicial : outro(s.saqueInicial);
    const total = s.setFechado ? 0 : (s.a.pontos || 0) + (s.b.pontos || 0), d = 2 * (P - 1);
    const idx = total < d ? Math.floor(total / 2) : (P - 1) + (total - d);
    return idx % 2 === 0 ? primeiro : outro(primeiro);
  }
  function desenhar(s) {
    if (!s || !s.a || !s.b) return;
    ultimo = s;
    const esq = s.ladosTrocados ? s.b : s.a, dir = s.ladosTrocados ? s.a : s.b;
    pintar("E", esq); pintar("D", dir);
    const sv = servidor(s), ladoE = s.ladosTrocados ? "b" : "a";
    document.getElementById("sqE").className = "saque" + (sv && sv === ladoE ? " sim" : "");
    document.getElementById("sqD").className = "saque" + (sv && sv !== ladoE ? " sim" : "");
  }
  onValue(ref(db, ".info/serverTimeOffset"), snap => { desvio = snap.val() || 0; });
  onValue(ref(db, "marcador/estado"), snap => desenhar(snap.val()));
  setInterval(() => { if (ultimo) desenhar(ultimo); }, 250);
  onValue(ref(db, "marcador/logos"), snap => { logos = snap.val() || {}; if (ultimo) desenhar(ultimo); });

  // Toque: ecrã inteiro + não deixar o ecrã apagar
  document.body.addEventListener("click", async () => {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
    document.getElementById("aviso").style.display = "none";
  });
</script>
</body>
</html>
